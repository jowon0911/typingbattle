<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>코드 타자 배틀</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:data-room="${room.code}" th:data-nickname="${nickname}">
<div class="container">
    <h1>방 코드 <span class="room-code" th:text="${room.code}"></span></h1>
    <p id="status" class="hint">서버에 연결하는 중...</p>

    <div id="players"></div>

    <div class="stats">
        <div>언어 <b th:text="${room.snippet.language}"></b></div>
        <div>시간 <b id="time">0.0초</b></div>
        <div>타수 <b id="cpm">0</b></div>
        <div>정확도 <b id="accuracy">100%</b></div>
    </div>

    <p id="ime-warning" class="warning" hidden>한글 입력 상태예요. 한/영 키를 눌러 영어로 바꿔 주세요.</p>

    <pre id="code" class="code blur" th:text="${room.snippet.content}"></pre>

    <div id="result" class="result" hidden>
        <h2 id="result-title">결과</h2>
        <table class="result-table">
            <thead>
            <tr><th>순위</th><th>닉네임</th><th>걸린 시간</th><th>타수</th><th>정확도</th></tr>
            </thead>
            <tbody id="result-rows"></tbody>
        </table>
        <a href="/" class="button">로비로 돌아가기</a>
    </div>

    <div id="countdown" class="countdown" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<script src="/js/typing.js"></script>
<script>
    const roomCode = document.body.dataset.room;
    const myNickname = document.body.dataset.nickname;

    let rows = {};
    let lastSentProgress = -1;

    canType = false;
    setupCode(document.getElementById("code"));

    const client = new StompJs.Client({
        brokerURL: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
    });

    client.onConnect = function () {
        client.subscribe("/topic/rooms/" + roomCode, function (message) {
            const data = JSON.parse(message.body);
            if (data.type === "PLAYERS") {
                showPlayers(data.players);
            }
            if (data.type === "COUNTDOWN") {
                startCountdown();
            }
            if (data.type === "PROGRESS" && data.nickname !== myNickname) {
                setPlayerProgress(data.nickname, data.progress);   // 상대 진행률
            }
            if (data.type === "FINISH") {
                showFinish(data);
            }
        });

        client.publish({
            destination: "/app/rooms/" + roomCode + "/join",
            body: JSON.stringify({ nickname: myNickname })
        });
    };

    client.activate();

    function showPlayers(players) {
        const box = document.getElementById("players");
        box.innerHTML = "";
        rows = {};

        for (let i = 0; i < players.length; i++) {
            const name = players[i];

            const row = document.createElement("div");
            row.className = "player-row";

            const label = document.createElement("span");
            label.textContent = name;
            if (name === myNickname) {
                label.textContent += " (나)";
            }

            const bar = document.createElement("div");
            bar.className = "bar";
            const fill = document.createElement("div");
            fill.className = "bar-fill";
            if (name !== myNickname) {
                fill.classList.add("other");   // 상대 막대는 파란색
            }
            bar.appendChild(fill);

            const percent = document.createElement("span");
            percent.textContent = "0%";

            row.appendChild(label);
            row.appendChild(bar);
            row.appendChild(percent);
            box.appendChild(row);

            rows[name] = { fill: fill, percent: percent };
        }

        if (players.length < 2) {
            document.getElementById("status").textContent = "상대를 기다리는 중이에요. 친구에게 방 코드를 알려 주세요!";
        } else {
            document.getElementById("status").textContent = "상대가 들어왔어요! 곧 시작해요.";
        }
    }

    function setPlayerProgress(name, progress) {
        const row = rows[name];
        if (row) {
            row.fill.style.width = progress + "%";
            row.percent.textContent = progress + "%";
        }
    }

    function startCountdown() {
        const countdown = document.getElementById("countdown");
        let count = 3;
        countdown.textContent = count;
        countdown.hidden = false;

        const countdownTimer = setInterval(function () {
            count--;
            if (count > 0) {
                countdown.textContent = count;
            } else {
                clearInterval(countdownTimer);
                countdown.hidden = true;
                document.getElementById("code").classList.remove("blur");
                document.getElementById("status").textContent = "시작! 코드를 입력하세요.";
                canType = true;
                startTime = Date.now();
            }
        }, 1000);
    }

    function showFinish(data) {
        const tr = document.createElement("tr");
        const values = [
            data.rank + "위",
            data.nickname,
            (data.elapsedMs / 1000).toFixed(1) + "초",
            data.cpm,
            data.accuracy + "%"
        ];
        for (let i = 0; i < values.length; i++) {
            const td = document.createElement("td");
            td.textContent = values[i];
            tr.appendChild(td);
        }
        document.getElementById("result-rows").appendChild(tr);
        document.getElementById("result").hidden = false;

        if (data.rank === 1) {
            let title;
            if (data.nickname === myNickname) {
                title = "승리! 가장 먼저 완성했어요.";
            } else {
                title = data.nickname + "님이 먼저 완성했어요!";
            }
            document.getElementById("result-title").textContent = title;
            document.getElementById("status").textContent = title;
        }

        if (rows[data.nickname]) {
            rows[data.nickname].percent.textContent = data.rank + "위";
        }
    }

    function updateScreen() {
        document.getElementById("time").textContent = (getElapsedMs() / 1000).toFixed(1) + "초";
        document.getElementById("cpm").textContent = getCpm();
        document.getElementById("accuracy").textContent = getAccuracy() + "%";
        setPlayerProgress(myNickname, getProgress());

        if (getProgress() !== lastSentProgress) {
            lastSentProgress = getProgress();
            client.publish({
                destination: "/app/rooms/" + roomCode + "/progress",
                body: JSON.stringify({ nickname: myNickname, progress: lastSentProgress })
            });
        }
    }

    function gameFinished() {
        updateScreen();
        client.publish({
            destination: "/app/rooms/" + roomCode + "/finish",
            body: JSON.stringify({ nickname: myNickname, cpm: getCpm(), accuracy: getAccuracy() })
        });
    }

    function showImeWarning(show) {
        document.getElementById("ime-warning").hidden = !show;
    }

    setInterval(function () {
        if (startTime !== 0 && endTime === 0) {
            updateScreen();
        }
    }, 100);
</script>
</body>
</html>
