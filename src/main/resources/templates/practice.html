<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>혼자 연습하기 - 코드 타자 배틀</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="page-header">
    <div>
      <h1>⌨️ 혼자 연습하기</h1>
      <p class="hint">화면의 코드를 그대로 입력하세요. 첫 글자를 치는 순간 시간이 시작돼요.</p>
    </div>
    <a href="/" class="button button-ghost">← 로비로</a>
  </div>

  <div class="tabs">
    <a href="/practice?difficulty=RANDOM" th:classappend="${difficulty == 'RANDOM'} ? 'active'">랜덤</a>
    <a href="/practice?difficulty=EASY" th:classappend="${difficulty == 'EASY'} ? 'active'">쉬움</a>
    <a href="/practice?difficulty=NORMAL" th:classappend="${difficulty == 'NORMAL'} ? 'active'">보통</a>
    <a href="/practice?difficulty=HARD" th:classappend="${difficulty == 'HARD'} ? 'active'">어려움</a>
  </div>

  <div class="stats">
    <div class="stat"><span>시간</span><b id="time">0.0초</b></div>
    <div class="stat"><span>타수</span><b id="cpm">0</b></div>
    <div class="stat"><span>정확도</span><b id="accuracy">100%</b></div>
    <div class="stat"><span>진행률</span><b id="progress">0%</b></div>
  </div>
  <div class="bar"><div id="progress-bar" class="bar-fill"></div></div>

  <p id="ime-warning" class="warning" hidden>한글 입력 상태예요. 한/영 키를 눌러 영어로 바꿔 주세요.</p>

  <div class="editor">
    <div class="editor-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="editor-title" th:text="${snippet.language}"></span>
      <span class="level" th:classappend="${'level-' + snippet.difficulty}" th:text="${snippet.difficultyLabel}"></span>
    </div>
    <pre id="code" class="code" th:text="${snippet.content}"></pre>
  </div>

  <div id="result" class="result" hidden>
    <h2>🎉 완료!</h2>
    <p id="result-text" class="hint"></p>
    <div class="result-buttons">
      <a th:href="@{/practice(difficulty=${difficulty})}" class="button">다른 문제 하기</a>
      <a href="/" class="button button-ghost">로비로</a>
    </div>
  </div>
</div>

<script src="/js/typing.js"></script>
<script>
  setupCode(document.getElementById("code"));

  function updateScreen() {
    document.getElementById("time").textContent = (getElapsedMs() / 1000).toFixed(1) + "초";
    document.getElementById("cpm").textContent = getCpm();
    document.getElementById("accuracy").textContent = getAccuracy() + "%";
    document.getElementById("progress").textContent = getProgress() + "%";
    document.getElementById("progress-bar").style.width = getProgress() + "%";
  }

  function gameFinished() {
    updateScreen();
    document.getElementById("result-text").textContent =
            "걸린 시간 " + (getElapsedMs() / 1000).toFixed(1) + "초, " +
            "타수 " + getCpm() + ", 정확도 " + getAccuracy() + "%, 오타 " + errorCount + "번";
    document.getElementById("result").hidden = false;
  }

  function showImeWarning(show) {
    document.getElementById("ime-warning").hidden = !show;
  }

  setInterval(function () {
    if (startTime !== 0 && endTime === 0) {
      updateScreen();
    }
  }, 100);
</script>
</body>
</html>
